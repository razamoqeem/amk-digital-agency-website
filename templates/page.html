<!DOCTYPE html>
<html lang="$lang">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$title</title>
  <meta name="description" content="$description" />
$head_extra
  <link rel="icon" href="/assets/logo.png" />
  <link rel="stylesheet" href="/assets/site.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/"><img src="/assets/logo.png" alt="" width="28" height="28" /> $site_name</a>
      <nav aria-label="Main">
        <ul class="nav-list">
$nav_items
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap page-body">
$body
  </main>
  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>&copy; $year $footer_text</span>
      <span>$footer_links</span>
      <span class="preview-label">$preview_label</span>
    </div>
  </footer>
</body>
</html>
